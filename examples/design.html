<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Example</title>
  <meta name="design-schema" content="3.0">
  <style>:root{ --color-bg:#f5f5f7; --color-surface:#ffffff; --color-ink:#111827; --color-muted:#6b7280; --color-line:#e5e7eb; --color-accent:#4c8dff; --space-xs:4px; --space-sm:8px; --space-md:16px; --space-lg:24px; --space-xl:32px; --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-full:9999px; --size-caption:12px; --size-label:14px; --size-body:16px; --size-title:20px; --size-headline:24px; --size-display:32px; --font-body:Inter, system-ui, sans-serif; --shadow-card:0 1px 2px #00000014 }</style>
  <style>section[data-type="page"]{ margin:0 0 24px }</style>
</head>
<body>
  <section data-id="home" data-type="page" data-canvas="0,0" style="width:390px;height:844px;overflow:hidden">
    <div data-id="home__root" data-type="frame" style="display:flex;flex-direction:column;gap:16px;padding:0 0 24px 0;width:100%;height:100%;background-color:#f5f5f7">
      <p data-id="home__title" data-type="text" style="font-size:32px;font-weight:700">Example</p>
    <div data-id="home__header" data-type="frame" style="display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:56px;background-color:#ffffff">
  <p data-id="home__greeting" data-type="text" style="font-size:20px;font-weight:600;color:var(--color-ink)">Good morning</p>
  <svg data-id="home__bell" data-type="icon" data-icon="bell" data-icon-library="lucide" style="width:24px;height:24px;color:var(--color-ink)"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
</div><div data-id="home__hero" data-type="frame" style="display:flex;flex-direction:column;gap:8px;padding:20px;background-color:var(--color-accent);border-radius:16px">
  <p data-id="home__hero-title" data-type="text" style="font-size:24px;font-weight:700;color:#ffffff">Ship this week</p>
  <p data-id="home__hero-copy" data-type="text" style="font-size:14px;line-height:1.5;color:#ffffffcc">Every screen, validated, and yours to drag.</p>
</div><div data-id="home__stats" data-type="frame" style="display:flex;flex-direction:row;gap:12px">
  <div data-id="home__stat-a" data-type="frame" style="display:flex;flex-direction:column;gap:4px;padding:16px;min-width:0;flex:1 1 0%;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:12px">
    <p data-id="home__stat-a-label" data-type="text" style="font-size:12px;color:var(--color-muted)">Screens</p>
    <p data-id="home__stat-a-value" data-type="text" style="font-size:28px;font-weight:700;color:var(--color-ink)">12</p>
  </div>
  <div data-id="home__stat-b" data-type="frame" style="display:flex;flex-direction:column;gap:4px;padding:16px;min-width:0;flex:1 1 0%;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:12px">
    <p data-id="home__stat-b-label" data-type="text" style="font-size:12px;color:var(--color-muted)">Reviewers</p>
    <p data-id="home__stat-b-value" data-type="text" style="font-size:28px;font-weight:700;color:var(--color-ink)">3</p>
  </div>
</div><div data-id="home__list" data-type="frame" style="display:flex;flex-direction:column;gap:8px;padding:16px;background-color:#ffffff;border-radius:12px">
  <div data-id="home__row-a" data-type="frame" style="display:flex;align-items:center;gap:12px">
    <svg data-id="home__row-a-icon" data-type="icon" data-icon="check" data-icon-library="lucide" style="width:20px;height:20px;color:var(--color-accent)"><path d="M20 6 9 17l-5-5"></path></svg>
    <p data-id="home__row-a-text" data-type="text" style="font-size:14px;color:var(--color-ink)">Home screen</p>
  </div>
  <div data-id="home__row-b" data-type="frame" style="display:flex;align-items:center;gap:12px">
    <svg data-id="home__row-b-icon" data-type="icon" data-icon="check" data-icon-library="lucide" style="width:20px;height:20px;color:var(--color-accent)"><path d="M20 6 9 17l-5-5"></path></svg>
    <p data-id="home__row-b-text" data-type="text" style="font-size:14px;color:var(--color-ink)">Settings</p>
  </div>
</div></div>
  </section>
</body>
</html>
