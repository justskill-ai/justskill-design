<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>data-uri</title>
  <meta name="design-schema" content="3.0">
  <style>
    :root{ --color-ink:#0b0d12; --font-stack:"Foo;Bar", "Baz;Qux", sans-serif; --hero-image:url("data:image/svg+xml;base64,AAA") }
  </style>
  <style>
    section[data-type="page"]{ margin:0 0 24px; background-image:url("data:image/svg+xml;base64,AAA") }
  </style>
</head>
<body>
  <section data-id="hero" data-type="page" data-canvas="0,0" data-name="首页" style="width:390px;height:844px">
    <div data-id="hero__bg" data-type="frame" style="display:flex;flex-direction:column;gap:8px;padding:24px;background-image:url(&quot;data:image/svg+xml;base64,AAA&quot;)">
      <div data-id="hero__thumb" data-type="frame" style="width:120px;height:80px;background-image:url(&quot;a;b.svg&quot;)">
        <img data-id="hero__photo" data-type="image" alt="占位图" src="data:image/svg+xml;base64,AAA" style="width:120px;height:80px" />
      </div>
      <div data-id="hero__inline" data-type="frame" style="width:120px;height:80px;background-image:url(&quot;data:image/svg+xml;base64,AAA&quot;)">
        <p data-id="hero__title" data-type="text" style="font-family:&quot;&amp;quot&quot;;font-size:28px;font-weight:700;color:var(--color-ink)">你好</p>
      </div>
      <p data-id="hero__caption" data-type="text" style="font-size:12px;color:#6b7280">图 1；图 2</p>
    </div>
  </section>
</body>
</html>
