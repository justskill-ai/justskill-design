<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>svg-icon</title>
  <meta name="design-schema" content="3.0">
  <style>
    :root{ --color-ink:#0b0d12; --color-line:#e5e7eb }
  </style>
  <style>
    section[data-type="page"]{ margin:0 0 24px; background-image:url("data:image/svg+xml;base64,PHN2Zy8+") }
  </style>
</head>
<body>
  <section data-id="nav" data-type="page" data-canvas="0,0" data-name="导航" style="width:390px;height:844px">
    <div data-id="nav__bar" data-type="frame" style="display:flex;flex-direction:row;align-items:center;gap:12px;padding:12px;background-color:#ffffff">
      <svg data-id="nav__search" data-type="icon" data-icon="search" data-icon-library="lucide" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:24px;height:24px;color:var(--color-ink)">
        <title>搜索</title>
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
      <p data-id="nav__label" data-type="text" style="font-size:16px;font-weight:600;color:var(--color-ink)">搜索</p>
    </div>
    <div data-id="nav__tile" data-type="frame" style="display:flex;flex-direction:column;gap:8px;padding:16px">
      <svg data-id="nav__tile-icon" data-type="icon" data-icon="image" data-icon-library="lucide" viewBox="0 0 24 24" style="width:48px;height:48px;background-image:url(&quot;data:image/svg+xml;base64,PHN2Zy8+&quot;)">
        <title>封面</title>
        <path d="M3 3h18v18H3z"></path>
        <circle cx="12" cy="12" r="4"></circle>
      </svg>
      <p data-id="nav__tile-caption" data-type="text" style="font-size:12px;color:var(--color-line)">封面</p>
    </div>
  </section>
</body>
</html>
