<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>simple</title>
  <meta name="design-schema" content="3.0">
  <style>
    :root{ --color-bg:#ffffff; --color-ink:#0b0d12; --color-muted:#6b7280; --space-md:16px; --radius-card:12px }
  </style>
  <style>
    section[data-type="page"]{ margin:0 0 24px; background-color:var(--color-bg) }
  </style>
</head>
<body>
  <section data-id="home" data-type="page" data-name="首页" data-canvas="0,0" style="width:390px;height:844px;overflow:hidden">
    <div data-id="home__root" data-type="frame" style="display:flex;flex-direction:column;gap:16px;padding:24px">
      <p data-id="home__title" data-type="text" style="font-size:32px;font-weight:700;line-height:1.2;color:var(--color-ink)">你好</p>
      <div data-id="home__card" data-type="frame" style="display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:12px;background-color:#f5f5f7">
        <p data-id="home__card-label" data-type="text" style="font-size:14px;color:var(--color-muted)">标签</p>
        <p data-id="home__card-value" data-type="text" style="font-size:24px;font-weight:600;color:var(--color-ink)">128</p>
      </div>
    </div>
  </section>
</body>
</html>
