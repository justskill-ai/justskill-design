# Publish to npm when a release tag is pushed.
#
# Authentication is **OIDC trusted publishing**, not a token: npm exchanges the
# GitHub Actions identity token for a short-lived, workflow-specific publish
# credential. Nothing long-lived exists to leak, rotate or bypass 2FA with.
#
# One-time setup on npmjs.com → Packages → justskill-design → Settings →
# Trusted publishing → "GitHub Actions":
#
#   Organization or user ..... justskill-ai
#   Repository ............... justskill-design
#   Workflow filename ........ publish.yml      (filename only, exact, with .yml)
#   Environment name ......... (leave empty)
#   Allowed actions .......... tick "Allow npm publish"  ← the default is
#                              stage-only; without this the job publishes
#                              nothing and fails
#
# Then, and only then, push a v*.*.* tag. A new trusted publisher must complete
# its first successful publish within 2 days or it expires (it is validated by
# that first publish), so create it when you are ready to release.
#
# Afterwards, harden the package: Settings → Publishing access → "Require
# two-factor authentication and disallow tokens". Trusted publishers keep
# working; token-based publishing stops.
#
# A release, in short:
#
#   npm test                                  # it also checks the version pins
#   git commit -am "chore: release X.Y.Z"     # package.json is the authority;
#                                             # SKILL.md and both READMEs follow
#   git tag -a vX.Y.Z -m "X.Y.Z — <one line>"
#   git push origin main && git push origin vX.Y.Z
#
# The tag must point at a commit that contains this file: GitHub reads the
# workflow from the pushed ref, so a tag on an older commit publishes nothing.
# A version number is never reusable — not even after `npm unpublish` — so a
# failed release means the next number, not a retry.
#
# The same run also publishes the GitHub release. It has to: the in-app
# "有新版" badge links to /releases/latest, so a tag without a release page
# makes that link land on the previous release. The body is generated by
# `scripts/release-notes.mjs` — update commands first, then Features / Fixes /
# Changes and the commit list between the previous tag and this one.
#
# Confirm it landed; a green run only means npm accepted the request:
#
#   npm view justskill-design version dist-tags
#   npm view justskill-design@X.Y.Z _npmUser gitHead dist.attestations
#
# `_npmUser` must be "GitHub Actions <npm-oidc-no-reply@github.com>"; a human
# account means it was published by hand, without provenance. The version can
# read as "Validating" on npmjs.com for a minute or two — automated review —
# and `latest` has not moved yet.
name: publish

on:
  push:
    tags:
      - "v*.*.*"

# `contents: write` is for the release page at the end of the job; nothing
# else writes to the repository. `id-token: write` is the whole npm
# authentication: it lets this job ask GitHub for an OIDC token, which npm
# verifies against the trusted publisher above and which also signs the
# provenance attestation (npm generates that automatically — no --provenance).
permissions:
  contents: write
  id-token: write

# One publish per tag. A cancelled job can leave npm mid-request, so a second
# run waits rather than races.
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish
    # Trusted publishing requires cloud runners; self-hosted is not supported.
    runs-on: ubuntu-latest
    steps:
      # Full history and every tag: the release body is built from the commits
      # between the previous tag and this one, and a shallow clone has neither.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Release builds never cache: a poisoned or stale cache is a supply
          # chain problem that a tag push should not be able to hit.
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1+ (Node 24 also needs 22.14+). Pinned
      # so a runner image change cannot silently drop below it.
      - name: npm version
        run: |
          npm install -g 'npm@^11.5.1'
          npm --version

      # The tag names the version and the manifest names the version; publishing
      # when they disagree is the one mistake that cannot be undone.
      - name: The tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag: v$tag, package.json: $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package.json $version"
            exit 1
          fi

      # A version that is already on npm can never be published again, and npm
      # reports that only after the whole tarball has been built. Fail here, in
      # five seconds, naming the one thing to do about it.
      - name: The version is not on npm yet
        run: |
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "justskill-design@$version" version 2>/dev/null || true)"
          if [ -n "$published" ]; then
            echo "::error::justskill-design@$version is already published — bump the version before tagging"
            exit 1
          fi
          echo "justskill-design@$version is free"

      # The suite guards the rest of the release: SKILL.md tracks the version,
      # package.json ships every runtime file, and the canvas bridge and its
      # reference chips have their own regression cases.
      - name: Test
        run: npm test

      # No token, no secret: the npm CLI sees the OIDC environment and exchanges
      # it for a publish credential scoped to this repository and workflow.
      # A prerelease must not take over `latest`, so it publishes under `next`.
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) npm publish --access public --tag next ;;
            *)   npm publish --access public ;;
          esac

      # After npm accepted the tarball, not before: a release page for a version
      # nobody can install is worse than a delayed page. Creating or editing by
      # tag keeps a rerun safe — the version number itself is not reusable, so a
      # rerun never reaches this step anyway, but a manual re-run of the job
      # should not fail on "already exists".
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release-notes.mjs \
            --version "$version" \
            --to "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" > /tmp/release-notes.md
          cat /tmp/release-notes.md
          case "$version" in
            *-*) flags="--prerelease" ;;
            *)   flags="--latest" ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md $flags
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md \
              --verify-tag $flags
          fi
