# Publish to npm when a release tag is pushed.
#
# Authentication is **OIDC trusted publishing**, not a token: npm exchanges the
# GitHub Actions identity token for a short-lived, workflow-specific publish
# credential. Nothing long-lived exists to leak, rotate or bypass 2FA with.
#
# One-time setup on npmjs.com → Packages → justskill-design → Settings →
# Trusted publishing → "GitHub Actions":
#
#   Organization or user ..... justskill-ai
#   Repository ............... justskill-design
#   Workflow filename ........ publish.yml      (filename only, exact, with .yml)
#   Environment name ......... (leave empty)
#   Allowed actions .......... tick "Allow npm publish"  ← the default is
#                              stage-only; without this the job publishes
#                              nothing and fails
#
# Then, and only then, push a v*.*.* tag. A new trusted publisher must complete
# its first successful publish within 2 days or it expires (it is validated by
# that first publish), so create it when you are ready to release.
#
# Afterwards, harden the package: Settings → Publishing access → "Require
# two-factor authentication and disallow tokens". Trusted publishers keep
# working; token-based publishing stops.
name: publish

on:
  push:
    tags:
      - "v*.*.*"

# `contents: read` is all the checkout needs. `id-token: write` is the whole
# authentication: it lets this job ask GitHub for an OIDC token, which npm
# verifies against the trusted publisher above and which also signs the
# provenance attestation (npm generates that automatically — no --provenance).
permissions:
  contents: read
  id-token: write

# One publish per tag. A cancelled job can leave npm mid-request, so a second
# run waits rather than races.
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish
    # Trusted publishing requires cloud runners; self-hosted is not supported.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Release builds never cache: a poisoned or stale cache is a supply
          # chain problem that a tag push should not be able to hit.
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1+ (Node 24 also needs 22.14+). Pinned
      # so a runner image change cannot silently drop below it.
      - name: npm version
        run: |
          npm install -g 'npm@^11.5.1'
          npm --version

      # The tag names the version and the manifest names the version; publishing
      # when they disagree is the one mistake that cannot be undone.
      - name: The tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag: v$tag, package.json: $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package.json $version"
            exit 1
          fi

      # A version that is already on npm can never be published again, and npm
      # reports that only after the whole tarball has been built. Fail here, in
      # five seconds, naming the one thing to do about it.
      - name: The version is not on npm yet
        run: |
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "justskill-design@$version" version 2>/dev/null || true)"
          if [ -n "$published" ]; then
            echo "::error::justskill-design@$version is already published — bump the version before tagging"
            exit 1
          fi
          echo "justskill-design@$version is free"

      # The suite guards the rest of the release: SKILL.md tracks the version,
      # package.json ships every runtime file, and the canvas bridge and its
      # reference chips have their own regression cases.
      - name: Test
        run: npm test

      # No token, no secret: the npm CLI sees the OIDC environment and exchanges
      # it for a publish credential scoped to this repository and workflow.
      # A prerelease must not take over `latest`, so it publishes under `next`.
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) npm publish --access public --tag next ;;
            *)   npm publish --access public ;;
          esac
